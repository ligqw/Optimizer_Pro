name: Build C++ Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download WebView2 SDK via NuGet
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.2849.39 -OutputDirectory packages

    - name: Compile ZeroBloat.cpp
      run: cl.exe /O2 /std:c++17 /EHsc /D WV2_USE_STATIC_LOADER=0 ZeroBloat.cpp /I packages\Microsoft.Web.WebView2.1.0.2849.39\build\native\include /link /SUBSYSTEM:WINDOWS ws2_32.lib iphlpapi.lib winhttp.lib wbemuuid.lib ole32.lib oleaut32.lib pdh.lib psapi.lib advapi32.lib crypt32.lib userenv.lib shell32.lib shlwapi.lib dwmapi.lib user32.lib gdi32.lib /OUT:ZeroBloat.exe

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: ZeroBloat-Release
        path: ZeroBloat.exe
